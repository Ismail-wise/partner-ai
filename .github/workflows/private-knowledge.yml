name: Private Workspace AI contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  private-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pbr-service.js && node --check private-knowledge.js && node --check chat-style.js
      - run: node --test tests/*.test.js
